name: RustSec audit

on:
  push:
    branches:
      - "**"
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rustsec.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/rustsec.yml
  # The schedule catches new advisories when the lockfile has not changed.
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rustsec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    # The hosted-run timing receipt is unavailable; remeasure before changing this timeout.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
