version: "2"
kind: StacksteadProject

project:
  name: stackstead-yarn-classic

source:
  provider: git-worktree
  base: main

state:
  root: "../.stacksteads"

runtime:
  provider: docker-compose
  files:
    - docker-compose.yml
  readiness:
    required:
      web: long-running

resources:
  ports:
    strategy: deterministic
    base: 41000
    stride: 20
    expose:
      web:
        container: 3000
        url: "http://127.0.0.1:{{ ports.web }}"

dependencies:
  install:
    command: "sh ./scripts/link-packages.sh"
    shell: false

env:
  file: ".stackstead/.env"
  generate:
    WEB_PORT: "{{ ports.web }}"
    STACKSTEAD_ID: "{{ stackstead.id }}"

agent:
  context_file: ".stackstead/AGENT_CONTEXT.md"
  rules:
    - "Run scripts/link-packages.sh for installation and repository-local Yarn Classic links."
    - "Do not use a shared global Yarn link folder for this stackstead."
